name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Parse scripts
        run: bash -n scripts/*.sh
      - name: Lint scripts
        run: shellcheck -x -P scripts scripts/*.sh
